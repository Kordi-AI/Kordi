<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory categories · Kordi proposal</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<!-- Standalone design preview: up to three categories per memory, chosen with checkboxes. Synthetic data, no network calls, system fonts only. -->
<main class="stage">
  <section class="block" aria-labelledby="rows-title">
    <h1 class="note" id="rows-title">Settings › Memory</h1>
    <div class="pair">
      <div class="mac-frame">
        <div class="frame-label">Mac · click a chevron</div>
        <div class="mac-pane" id="mac"></div>
      </div>
      <div class="phone-frame">
        <div class="frame-label">iPhone · long-press menu › Categories</div>
        <div class="phone" id="ios"></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="preview.js"></script>
</body>
</html>
