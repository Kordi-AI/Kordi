<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts tab · Kordi proposal</title>
<style>
:root {
  --page: #e9e9ec;
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --faint: #a1a1a6;
  --line: #ececef;
  --hover: #f5f5f7;
  --control: #f2f2f4;
  --card: #fafafa;
  --paper: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 14px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.08);
  --accent: #2f5bd3;
  --md: #2b7fd8; --md-bg: rgba(43,127,216,.10);
  --html: #e2670f; --html-bg: rgba(226,103,15,.10);
  --code: #7a4fd6; --code-bg: rgba(122,79,214,.10);
  --csv: #1f9d55; --csv-bg: rgba(31,157,85,.10);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --page: #111113;
  --bg: #1c1c1e;
  --fg: #f2f2f4;
  --muted: #9a9aa0;
  --faint: #6a6a70;
  --line: #2c2c2f;
  --hover: #252528;
  --control: #2a2a2d;
  --card: #232326;
  --paper: #2a2a2d;
  --shadow: 0 0 0 1px rgba(255,255,255,.07);
  --shadow-hover: 0 4px 14px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.12);
  --accent: #7d9cff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--faint); }

.stage { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--bg); border-radius: 9px; padding: 2px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--control); color: var(--fg); font-weight: 500; }
.notes { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; max-width: 760px; }

/* Window chrome copied from the screenshot's layout */
.window { background: var(--bg); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.08); min-height: 560px; display: flex; flex-direction: column; }
.titlebar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); }
.titlebar b { font-weight: 600; }
.titlebar small { color: var(--muted); margin-left: 8px; }
.titlebar .icons { display: flex; gap: 16px; color: var(--muted); }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.tab { display: flex; align-items: center; gap: 6px; padding: 10px 8px; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.on { color: var(--fg); border-color: var(--fg); }
.tab svg { width: 14px; height: 14px; }
.content { flex: 1; display: flex; min-height: 0; }
.column { width: 100%; max-width: 820px; margin: 0 auto; padding: 18px 24px 32px; }

/* Shared toolbar */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.search { flex: 1; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--control); color: var(--muted); }
.search input { flex: 1; border: 0; background: none; outline: none; color: var(--fg); font: inherit; }
.search svg { width: 14px; height: 14px; flex: none; }
.btn { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 8px; border: 0; background: var(--control); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.primary:hover { opacity: .88; }
.btn svg { width: 14px; height: 14px; }
.seg.layout { box-shadow: none; background: var(--control); padding: 2px; height: 32px; }
.seg.layout button { padding: 0; width: 30px; height: 28px; display: grid; place-items: center; }
.seg.layout button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.08); color: var(--fg); }
.seg.layout svg { width: 15px; height: 15px; }
.icon-btn { width: 32px; padding: 0; justify-content: center; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 36px; z-index: 5; width: 200px; background: var(--bg); border-radius: 10px; padding: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.08); display: none; }
.menu.open { display: block; }
.menu button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 9px; border-radius: 7px; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu small { color: var(--muted); display: block; font-size: 11.5px; }
.menu svg { width: 15px; height: 15px; color: var(--muted); }

.group { font-size: 12px; color: var(--muted); font-weight: 500; margin: 18px 0 6px; }
.group:first-of-type { margin-top: 0; }

/* File type tile */
.type { display: grid; place-items: center; flex: none; border-radius: 7px; font-size: 9.5px; font-weight: 650; letter-spacing: .02em; }
.type.md { background: var(--md-bg); color: var(--md); }
.type.html { background: var(--html-bg); color: var(--html); }
.type.code { background: var(--code-bg); color: var(--code); }
.type.csv { background: var(--csv-bg); color: var(--csv); }

.avatar { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 600; color: #fff; flex: none; }
.a1 { background: #c2410c; } .a2 { background: #0f766e; } .a3 { background: #6d28d9; }
.agent { background: var(--control); color: var(--muted); }

/* Option A: list */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; margin: 0 -10px; border-radius: 9px; cursor: pointer; position: relative; }
.row:hover { background: var(--hover); }
.row .type { width: 34px; height: 34px; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.row .meta .avatar { width: 14px; height: 14px; font-size: 8px; }
.row .side { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.row .when { min-width: 56px; text-align: right; }
.row .actions { display: none; gap: 2px; }
.row:hover .actions { display: flex; }
.row:hover .when { display: none; }
.ghost { width: 28px; height: 28px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.ghost:hover { background: var(--line); color: var(--fg); }
.ghost svg { width: 15px; height: 15px; }
.live { display: inline-flex; align-items: center; gap: 4px; color: var(--csv); }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.divider { height: 1px; background: var(--line); margin: 0 0 0 46px; }

/* Option B: cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; }
.card { cursor: pointer; }
.thumb { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .15s, transform .15s; }
.card:hover .thumb { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.page { position: absolute; inset: 12px 14px -10px; background: var(--paper); border-radius: 4px 4px 0 0; box-shadow: 0 0 0 1px var(--line); padding: 12px 12px; overflow: hidden; }
.page h4 { margin: 0 0 6px; font-size: 9px; line-height: 1.2; }
.page p { margin: 0 0 4px; font-size: 6.5px; line-height: 1.45; color: var(--muted); }
.page .bar { height: 4px; border-radius: 2px; background: var(--line); margin: 0 0 4px; }
.page.html { padding: 0; }
.page.html .hero { height: 38%; background: linear-gradient(135deg, #f6d6bd, #f2a66d); }
.page.html .navb { height: 9px; background: var(--paper); border-bottom: 1px solid var(--line); }
.page.html .blocks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; }
.page.html .blocks span { height: 22px; border-radius: 3px; background: var(--line); }
.page.code { background: #1e1e22; box-shadow: none; font: 6.5px/1.6 ui-monospace, Menlo, monospace; color: #b8b8c0; white-space: pre; }
.page.code .k { color: #c792ea; } .page.code .s { color: #c3e88d; } .page.code .f { color: #82aaff; }
.page.csv { padding: 8px; }
.page.csv table { width: 100%; border-collapse: collapse; font-size: 6.5px; color: var(--muted); }
.page.csv td { border-bottom: 1px solid var(--line); padding: 3px 2px; }
.page.csv tr:first-child td { color: var(--fg); font-weight: 600; }
.thumb .type { position: absolute; left: 8px; bottom: 8px; width: auto; height: 18px; padding: 0 6px; font-size: 9px; box-shadow: 0 0 0 2px var(--card); }
.thumb .live { position: absolute; right: 8px; top: 6px; font-size: 10.5px; background: var(--bg); padding: 1px 6px; border-radius: 6px; box-shadow: var(--shadow); }
.card .title { margin-top: 8px; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
.card .meta .avatar { width: 14px; height: 14px; font-size: 8px; }
.new-card .thumb { background: none; box-shadow: inset 0 0 0 1.5px var(--line); display: grid; place-items: center; color: var(--muted); }
.new-card .thumb div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; }
.new-card .thumb svg { width: 20px; height: 20px; }
.new-card:hover .thumb { background: var(--hover); box-shadow: inset 0 0 0 1.5px var(--line); }

/* Option C: list + reader */
.split { display: flex; width: 100%; min-height: 0; }
.split .list { width: 300px; flex: none; border-right: 1px solid var(--line); padding: 14px 12px; }
.split .list .toolbar { margin-bottom: 12px; }
.split .row { margin: 0; padding: 8px; }
.split .row .type { width: 28px; height: 28px; font-size: 8.5px; }
.split .row .title { font-size: 13px; }
.split .row.on { background: var(--control); }
.split .row .side { display: none; }
.reader { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.reader-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.reader-head .t { flex: 1; min-width: 0; font-weight: 500; }
.reader-head .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.reader-body { padding: 26px 40px; max-width: 680px; }
.reader-body h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
.reader-body .byline { color: var(--muted); font-size: 12px; margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }
.reader-body h2 { font-size: 15px; margin: 20px 0 6px; }
.reader-body p, .reader-body li { font-size: 13.5px; line-height: 1.6; }

/* Before */
.before .column { max-width: none; padding: 18px 24px 32px 95px; }
.before .acts { display: flex; gap: 18px; margin-bottom: 14px; color: var(--fg); font-size: 12.5px; }
.before .kicker { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.before .old-row { display: flex; gap: 12px; align-items: center; background: #f5f5f5; padding: 12px; border-radius: 6px; }
:root[data-theme="dark"] .before .old-row { background: #262629; }
.before .old-row .type { width: 26px; height: 26px; }
.before .problems { margin-top: 28px; color: var(--muted); font-size: 12.5px; max-width: 560px; }
.before .problems li { margin-bottom: 4px; }

@media (max-width: 720px) {
  .split .list { width: 100%; border-right: 0; }
  .reader { display: none; }
  .column { padding: 14px 16px 24px; }
  .before .column { padding-left: 16px; }
}
</style>
</head>
<body>
<!-- Standalone design preview for the chat Artifacts tab. Synthetic people and documents, no network calls, system fonts only. -->
<main class="stage">
  <div class="controls">
    <div class="seg" role="group" aria-label="Option">
      <button data-view="before">Today</button>
      <button data-view="a" aria-pressed="true">A · List</button>
      <button data-view="b">B · Cards</button>
      <button data-view="c">C · List + reader</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button data-theme="light" aria-pressed="true">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
  <p class="notes" id="note"></p>

  <div class="window">
    <div class="titlebar">
      <div><b>Maya Chen</b><small>online</small></div>
      <div class="icons">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m22 8-6 4 6 4V8z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      </div>
    </div>
    <nav class="tabs">
      <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</span>
      <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Info</span>
      <span class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 14 7.5 11.1A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6A2 2 0 0 1 18.4 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></svg>Artifacts</span>
      <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Tasks</span>
      <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20M2 12h20"/></svg>Memory</span>
    </nav>
    <div class="content" id="content"></div>
  </div>
</main>

<script>
const PEOPLE = {
  me: { name: 'You', initials: 'Y', cls: 'a1' },
  maya: { name: 'Maya', initials: 'M', cls: 'a2' },
  agent: { name: 'Agent', initials: '✦', cls: 'agent' },
};
const ITEMS = [
  { id: 'pr', title: 'PR review notes', ext: 'md', kind: 'md', label: 'Markdown', by: 'agent', when: '08:48', group: 'Today', live: true,
    lines: ['Summary of the change', 'The sidebar now loads sessions before hydrating transcripts. Two follow-ups remain for the iOS client.', 'Risks', 'Cached transcripts may show stale titles for one refresh.'] },
  { id: 'landing', title: 'Launch page draft', ext: 'html', kind: 'html', label: 'HTML', by: 'maya', when: '08:12', group: 'Today' },
  { id: 'plan', title: 'Offsite plan', ext: 'md', kind: 'md', label: 'Markdown', by: 'me', when: 'Yesterday', group: 'Earlier',
    lines: ['Day one', 'Arrive by ten, short intros, then the roadmap walk-through.', 'Day two', 'Hands-on build session and a demo hour.'] },
  { id: 'parse', title: 'parse_events.ts', ext: 'ts', kind: 'code', label: 'TypeScript', by: 'agent', when: 'Mon', group: 'Earlier' },
  { id: 'budget', title: 'Q4 budget', ext: 'csv', kind: 'csv', label: 'CSV', by: 'maya', when: 'Nov 3', group: 'Earlier' },
];

const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>',
  clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
};

const NOTES = {
  before: 'The tab today: the first row is auto-selected, so a grey slab fills the width before anything is clicked. "Generated artifacts" is jargon, the row shows a bare title and a time, and the column starts at an indent that lines up with nothing.',
  a: 'A · List. One centred column, search plus a single New menu, rows grouped by day. Each row shows a type tile, the title, and type · author · time. No row is selected until you click; hover swaps the time for Open, Share and More. Lowest-risk change: ArtifactListRow, the section header and ChatDocumentEntries.',
  b: 'B · Cards (default). The grid/list switch beside search swaps to A and is remembered per Mac. Each artifact is a thumbnail of its first lines, so documents, pages, code and tables are recognisable at a glance. The first card is New document. Best for chats with a handful of documents; needs a cached first-lines snippet per artifact.',
  c: 'C · List + reader. The list moves to a 300 px rail and the selected artifact reads on the right, which uses the empty width. Selection is meaningful again. Overlaps with the companion pane in chats, so it fits the contact page best.',
};

function person(id, small) {
  const p = PEOPLE[id];
  return `<span class="avatar ${p.cls}">${p.initials}</span>${p.name}`;
}
function typeTile(item) {
  return `<span class="type ${item.kind}" title="${item.label}">${item.ext.toUpperCase()}</span>`;
}
function when(item) {
  return item.live ? '<span class="live">Editing</span>' : item.when;
}
function layoutSwitch() {
  if (state.view !== 'a' && state.view !== 'b') return '';
  return `<div class="seg layout" role="group" aria-label="Layout">
    <button data-layout="b" aria-pressed="${state.view === 'b'}" title="Cards" aria-label="Cards">${ICON.grid}</button>
    <button data-layout="a" aria-pressed="${state.view === 'a'}" title="List" aria-label="List">${ICON.list}</button>
  </div>`;
}
function toolbar(compact) {
  return `<div class="toolbar">
    <label class="search">${ICON.search}<input placeholder="Search" aria-label="Search artifacts"></label>
    ${layoutSwitch()}
    <div class="menu-wrap">
      <button class="btn ${compact ? 'icon-btn' : 'primary'}" data-menu aria-haspopup="menu" aria-label="New">${ICON.plus}${compact ? '' : 'New'}</button>
      <div class="menu" role="menu">
        <button role="menuitem">${ICON.doc}<span>New document</span></button>
        <button role="menuitem">${ICON.clip}<span>Add file<small>Markdown or HTML</small></span></button>
      </div>
    </div>
  </div>`;
}
function groups(render) {
  const out = [];
  for (const g of ['Today', 'Earlier']) {
    const list = ITEMS.filter((i) => i.group === g);
    out.push(`<div class="group">${g}</div>` + render(list));
  }
  return out.join('');
}
function row(item, extra = '') {
  return `<div class="row ${extra}" data-id="${item.id}">
    ${typeTile(item)}
    <div class="main">
      <div class="title">${item.title}</div>
      <div class="meta">${item.label} · ${person(item.by)}${item.live ? '' : ''}</div>
    </div>
    <div class="side">
      <span class="when">${when(item)}</span>
      <span class="actions">
        <button class="ghost" title="Open">${ICON.open}</button>
        <button class="ghost" title="Share">${ICON.share}</button>
        <button class="ghost" title="More">${ICON.more}</button>
      </span>
    </div>
  </div>`;
}
function pageThumb(item) {
  if (item.kind === 'md') return `<div class="page"><h4>${item.title}</h4><p><b>${item.lines[0]}</b></p><p>${item.lines[1]}</p><p><b>${item.lines[2]}</b></p><p>${item.lines[3]}</p></div>`;
  if (item.kind === 'html') return `<div class="page html"><div class="navb"></div><div class="hero"></div><div class="blocks"><span></span><span></span><span></span></div></div>`;
  if (item.kind === 'code') return `<div class="page code"><span class="k">export function</span> <span class="f">parseEvents</span>(raw) {
  <span class="k">const</span> rows = raw.<span class="f">split</span>(<span class="s">'\\n'</span>);
  <span class="k">return</span> rows
    .<span class="f">filter</span>(Boolean)
    .<span class="f">map</span>(toEvent);
}</div>`;
  return `<div class="page csv"><table><tr><td>Item</td><td>Owner</td><td>Amount</td></tr><tr><td>Travel</td><td>Maya</td><td>4,200</td></tr><tr><td>Hosting</td><td>You</td><td>1,150</td></tr><tr><td>Design</td><td>Maya</td><td>2,800</td></tr><tr><td>Events</td><td>You</td><td>900</td></tr></table></div>`;
}

const VIEWS = {
  before() {
    return `<div class="column before">
      <div class="acts"><span>▢ New document</span><span>⌁ Add file</span></div>
      <div class="kicker">Generated artifacts</div>
      <div class="old-row"><span class="type md">▤</span><div><div>pr</div><div style="color:var(--muted);font-size:12px">08:48</div></div></div>
    </div>`;
  },
  a() {
    return `<div class="column" style="max-width:900px">${toolbar(true)}${groups((list) => `<div class="rows">${list.map((i) => row(i)).join('')}</div>`)}</div>`;
  },
  b() {
    const card = (i) => `<div class="card" data-id="${i.id}">
      <div class="thumb">${pageThumb(i)}${typeTile(i)}${i.live ? '<span class="live">Editing</span>' : ''}</div>
      <div class="title">${i.title}</div>
      <div class="meta">${person(i.by)} · ${i.when}</div>
    </div>`;
    const newCard = `<div class="card new-card"><div class="thumb"><div>${ICON.plus}New document</div></div></div>`;
    return `<div class="column" style="max-width:900px">${toolbar(true)}<div class="grid">${newCard}${ITEMS.map(card).join('')}</div></div>`;
  },
  c() {
    const sel = ITEMS.find((i) => i.id === state.selected) ?? ITEMS[0];
    const body = sel.kind === 'md'
      ? `<h1>${sel.title}</h1><div class="byline">${person(sel.by)} · ${sel.when}</div><h2>${sel.lines[0]}</h2><p>${sel.lines[1]}</p><h2>${sel.lines[2]}</h2><p>${sel.lines[3]}</p>`
      : `<h1>${sel.title}</h1><div class="byline">${person(sel.by)} · ${sel.when}</div><div class="thumb" style="aspect-ratio:16/10;max-width:520px">${pageThumb(sel)}</div>`;
    return `<div class="split">
      <div class="list">${toolbar(true)}${groups((list) => `<div class="rows">${list.map((i) => row(i, i.id === sel.id ? 'on' : '')).join('')}</div>`)}</div>
      <div class="reader">
        <div class="reader-head"><div class="t">${sel.title}<small>${sel.label} · ${sel.when}</small></div>
          <button class="ghost" title="Share">${ICON.share}</button><button class="ghost" title="Open in window">${ICON.open}</button><button class="ghost" title="More">${ICON.more}</button></div>
        <div class="reader-body">${body}</div>
      </div>
    </div>`;
  },
};

const state = { view: 'a', selected: 'pr' };
function render() {
  document.getElementById('content').innerHTML = VIEWS[state.view]();
  document.getElementById('note').textContent = NOTES[state.view];
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
}
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]');
  if (v) { state.view = v.dataset.view; render(); return; }
  const t = e.target.closest('[data-theme]');
  if (t) {
    document.documentElement.dataset.theme = t.dataset.theme;
    document.querySelectorAll('[data-theme]').forEach((b) => b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', String(b === t)));
    return;
  }
  const l = e.target.closest('[data-layout]');
  if (l) { state.view = l.dataset.layout; render(); return; }
  const m = e.target.closest('[data-menu]');
  document.querySelectorAll('.menu.open').forEach((x) => { if (!m || x !== m.nextElementSibling) x.classList.remove('open'); });
  if (m) { m.nextElementSibling.classList.toggle('open'); return; }
  const r = e.target.closest('.split .row');
  if (r) { state.selected = r.dataset.id; render(); }
});
render();
</script>
</body>
</html>
