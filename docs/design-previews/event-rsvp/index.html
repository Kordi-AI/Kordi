<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event RSVP · Kordi proposal</title>
<link rel="stylesheet" href="theme.css?v=1">
<link rel="stylesheet" href="preview.css?v=1">
</head>
<body>
<header class="review-controls" aria-label="Preview controls">
  <strong class="brand">Event RSVP</strong>
  <div class="segmented" data-param="device" aria-label="Device">
    <button data-value="mac">Mac</button><button data-value="ios">iPhone</button>
  </div>
  <div class="segmented" data-param="variant" aria-label="Variant">
    <button data-value="both">A and B</button><button data-value="a">A</button><button data-value="b">B</button>
  </div>
  <label>RSVP
    <select data-param="rsvp">
      <option value="mixed">Mixed</option>
      <option value="all-going">All going</option>
      <option value="no-replies">No replies</option>
      <option value="not-from-card">Not from a card</option>
    </select>
  </label>
  <label>You are
    <select data-param="role">
      <option value="member">Member</option>
      <option value="organizer">Organizer</option>
    </select>
  </label>
  <label>Load
    <select data-param="load">
      <option value="ready">Ready</option>
      <option value="loading">Loading</option>
    </select>
  </label>
  <span class="spacer"></span>
  <button class="plain" id="reset">Reset</button>
  <div class="segmented" data-param="theme" aria-label="Theme">
    <button data-value="light">Light</button><button data-value="dark">Dark</button>
  </div>
</header>
<main id="stages" aria-live="polite"></main>
<script src="preview.js?v=1"></script>
</body>
</html>
