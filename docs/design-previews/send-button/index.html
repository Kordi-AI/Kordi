<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send button</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f3f5; --page-ink: #1d1d1f; --page-muted: #6b6b70; --page-line: rgb(0 0 0 / 0.1);
  --page-surface: #ffffff; --page-segment: rgb(0 0 0 / 0.06);
  --m-canvas: #ffffff; --m-border: oklch(36% 0 0 / 0.15); --m-composer: oklch(98% 0 0 / 0.65);
  --m-muted: oklch(46% 0 0); --m-meta: oklch(49% 0 0); --m-ink: oklch(26% 0 0);
  --i-canvas: #ffffff; --i-glass: rgb(255 255 255 / 0.72); --i-glass-line: rgb(0 0 0 / 0.07);
  --i-fill3: rgb(118 118 128 / 0.12); --i-secondary: rgb(60 60 67 / 0.6); --i-label: #000;
  --ink: #1f1a17; --ink-on: #ffffff; --amber: #f7b32b;
  --accent: #0a66d6; --accent-on: #ffffff;
  --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
}
[data-theme=dark] {
  color-scheme: dark;
  --page: #0e0e0e; --page-ink: #eeeeee; --page-muted: #a1a1a6; --page-line: rgb(255 255 255 / 0.12);
  --page-surface: #1c1c1e; --page-segment: rgb(255 255 255 / 0.08);
  --m-canvas: #171717; --m-border: oklch(85% 0 0 / 0.16); --m-composer: oklch(29% 0 0 / 0.70);
  --m-muted: oklch(73% 0 0); --m-meta: oklch(71% 0 0); --m-ink: oklch(92% 0 0);
  --i-canvas: #171717; --i-glass: rgb(44 44 46 / 0.72); --i-glass-line: rgb(255 255 255 / 0.08);
  --i-fill3: rgb(118 118 128 / 0.24); --i-secondary: rgb(235 235 245 / 0.6); --i-label: #fff;
  --ink: #f2efe9; --ink-on: #1f1a17;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-ink); font: 14px/1.45 var(--font); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  padding: 14px 24px; background: color-mix(in oklab, var(--page) 88%, transparent); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--page-line); }
header h1 { margin: 0; font-size: 15px; font-weight: 600; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--page-segment); }
.seg button { border: 0; background: transparent; color: var(--page-ink); font: inherit; font-size: 12.5px;
  padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--page-surface); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.label { color: var(--page-muted); font-size: 12.5px; margin-right: 4px; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; display: grid; gap: 16px; }
.option { background: var(--page-surface); border: 1px solid var(--page-line); border-radius: 14px; padding: 16px 18px 18px; }
.option h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.option h2 .tag { margin-left: 8px; font-size: 11.5px; font-weight: 500; color: var(--page-muted); }
.option p { margin: 0 0 14px; color: var(--page-muted); font-size: 12.5px; }
.row { display: grid; grid-template-columns: 1.25fr 1fr auto; gap: 14px; align-items: center; }
@media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
.surface { border-radius: 12px; padding: 14px; }
.surface.mac { background: var(--m-canvas); border: 1px solid var(--m-border); }
.surface.ios { background: var(--i-canvas); border: 1px solid var(--page-line); }
.cap { font-size: 11px; color: var(--page-muted); margin: 0 0 6px 2px; }

/* Mac composer: matches .app-composer (pill), voice icon 36px, send 32px. */
.m-composer { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 14px;
  border: 1px solid var(--m-border); border-radius: 23px; background: var(--m-composer); color: var(--m-muted); font-size: 13px; }
.m-composer + .m-composer { margin-top: 10px; }
.m-plus { width: 16px; height: 16px; color: var(--m-muted); }
.m-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--m-ink); }
.m-text.ph { color: var(--m-meta); }
.m-voice { display: grid; place-items: center; width: 36px; height: 36px; color: var(--m-muted); }
.m-voice svg { width: 20px; height: 20px; }

/* iPhone composer: 50px "+" circle, 50px capsule field, 44px send inside the field. */
.i-composer { display: flex; align-items: center; gap: 8px; }
.i-composer + .i-composer { margin-top: 10px; }
.i-circle { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%;
  background: var(--i-glass); border: 1px solid var(--i-glass-line); color: var(--i-label); }
.i-circle svg { width: 20px; height: 20px; }
.i-field { flex: 1; min-width: 0; display: flex; align-items: center; height: 46px; padding: 0 2px 0 16px; border-radius: 23px;
  background: var(--i-glass); border: 1px solid var(--i-glass-line); font-size: 16px; color: var(--i-label); }
.i-field .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.i-field .t.ph { color: var(--i-secondary); }

/* The send button itself. */
.send { position: relative; flex: none; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-on); overflow: hidden; transition: transform 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms; }
.send:active:not(:disabled) { transform: scale(0.9); }
.send:disabled { cursor: default; opacity: 0.45; }
.send.mac { width: 32px; height: 32px; border-radius: 50%; }
.send.ios { width: 40px; height: 40px; border-radius: 50%; }
.send.mac svg { width: 15px; height: 15px; }
.send.ios svg { width: 19px; height: 19px; }
.send.ios.idle { background: var(--i-fill3); color: var(--accent); opacity: 1; }
.send.ios.idle svg { width: 18px; height: 18px; }
/* Shape and colour variants. */
.send.key.mac { border-radius: 9px; }
.send.key.ios { border-radius: 12px; }
.send.inked { background: var(--ink); color: var(--ink-on); }
.send.inked.ios.idle { background: var(--i-fill3); color: var(--ink); }
.send.bird svg { width: 21px !important; height: 21px !important; }
.send.bird.ios svg { width: 26px !important; height: 26px !important; }
.send.bird.idle svg { width: 18px !important; height: 18px !important; }
.send.leaf.mac svg { width: 16px; height: 16px; }
.send.leaf.ios svg { width: 20px; height: 20px; }

/* Send motion: the glyph leaves in its own direction, a new one settles in. */
.send .g { display: grid; place-items: center; }
.send.go .g { animation: var(--leave, leave-up) 320ms cubic-bezier(.4,0,.6,1) forwards; }
.send.back .g { animation: settle 220ms cubic-bezier(.2,.8,.2,1); }
@keyframes leave-up { to { transform: translateY(-140%); opacity: 0; } }
@keyframes leave-plane { to { transform: translate(120%, -120%); opacity: 0; } }
@keyframes leave-bird { 30% { transform: translate(0, 12%) rotate(4deg); } to { transform: translate(110%, -130%) rotate(-24deg) scale(.8); opacity: 0; } }
@keyframes settle { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .send .g { animation: none !important; } }

.big { display: flex; gap: 14px; align-items: center; padding: 0 6px; }
.big .send { width: 64px; height: 64px; }
.big .send svg { width: 28px; height: 28px; }
.big .send.key { border-radius: 18px; }
.big .send.bird svg { width: 40px !important; height: 40px !important; }
.big .send.leaf svg { width: 30px; height: 30px; }
.big .send:disabled { opacity: 1; }
footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; color: var(--page-muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Send button</h1>
  <span><span class="label">Theme</span><span class="seg" data-param="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></span></span>
  <span><span class="label">Chat theme</span><span class="seg" data-param="accent">
    <button data-v="classic">Classic</button><button data-v="slate">Slate</button><button data-v="teal">Teal</button><button data-v="plum">Plum</button><button data-v="clay">Clay</button>
  </span></span>
  <span class="label">Click a filled send button to see the send motion.</span>
</header>
<main id="options"></main>
<footer>Composer geometry follows <code>chatsPage.voiceControls.tsx</code> (Mac, 32px) and <code>ComposerView.swift</code> (iPhone, 44pt). Static page, no network.</footer>

<template id="sym">
  <svg id="s-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <svg id="s-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"/><circle cx="9.25" cy="12" r="1.1" fill="currentColor" stroke="none"/><path d="M11.34 9.51a3.25 3.25 0 0 1 0 4.98"/><path d="M13.11 7.4a6 6 0 0 1 0 9.2"/></svg>
  <svg id="s-mic" viewBox="0 0 24 24" fill="currentColor"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17.5V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</template>

<script>
const ACCENTS = {
  classic: ['#0A66D6', '#5EA2FF'], slate: ['#365F98', '#AEC4E3'], teal: ['#246775', '#A1CBD1'],
  plum: ['#6B5686', '#C7B5DD'], clay: ['#875837', '#D9B999'],
};

const GLYPH = {
  // lucide "send": the paper plane in today's Mac composer.
  plane: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>`,
  arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg>`,
  // Leaf arrowhead with a cut vein and a short stem.
  leaf: (id) => `<svg viewBox="0 0 24 24"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path d="M12 7.6V16.6" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></mask></defs><path mask="url(#${id})" fill="currentColor" d="M12 2.2C16.9 6.2 19.3 10.4 18.3 14.5C17.5 17.9 15 19.6 12 19.6C9 19.6 6.5 17.9 5.7 14.5C4.7 10.4 7.1 6.2 12 2.2Z"/><path d="M12 19.2V22.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  // The Kordi bird from the app icon, mirrored to face forward and tilted up for take-off.
  bird: (id, beak) => `<svg viewBox="66 82 420 420"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="560"><g transform="translate(552,0) scale(-1,1)"><ellipse cx="262" cy="292" rx="150" ry="136" fill="#fff"/><path d="M400,342 C436,322 462,272 470,204 C448,236 420,244 386,218Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><circle cx="196" cy="262" r="24"/><path d="M269.6,333.2 C292,299.6 348,282 397.6,285.2 C381.6,325.2 336.8,357.2 288.8,355.6 C272.8,354 264.8,344.4 269.6,333.2Z"/></g></mask></defs><g transform="rotate(-18 276 292)"><g transform="translate(552,0) scale(-1,1)"><path d="M120,276 L82,294 L120,312Z" fill="${beak}" stroke="${beak}" stroke-width="12" stroke-linejoin="round"/></g><rect x="0" y="0" width="560" height="560" fill="currentColor" mask="url(#${id})"/></g></svg>`,
};

const OPTIONS = [
  { key: 'current', title: 'Current', tag: 'Mac paper plane, iPhone arrow',
    note: 'Mac: lucide paper plane in a 32px accent circle, the Telegram look. iPhone already uses an up arrow, so the two apps disagree.',
    mac: { glyph: 'plane', cls: '', leave: 'leave-plane' }, ios: { glyph: 'arrow', cls: '' } },
  { key: 'a', title: 'A · Up arrow, both apps', tag: 'smallest change',
    note: 'Swap the Mac paper plane for the bold up arrow iPhone already ships. One glyph everywhere; reads as iMessage or ChatGPT rather than Telegram.',
    mac: { glyph: 'arrow', cls: '' }, ios: { glyph: 'arrow', cls: '' } },
  { key: 'b', title: 'B · Up arrow on a rounded key', tag: 'recommended',
    note: 'Same arrow, but the button becomes a rounded square (9px on Mac, 12pt on iPhone). The shape alone separates it from every circular chat send button.',
    mac: { glyph: 'arrow', cls: 'key' }, ios: { glyph: 'arrow', cls: 'key' } },
  { key: 'c', title: 'C · Bird', tag: 'brand',
    note: 'The Kordi bird in white with its amber beak, tilted up; on send it hops and flies off. Most ownable, least obvious as a send action at 15px.',
    mac: { glyph: 'bird', cls: 'bird', leave: 'leave-bird' }, ios: { glyph: 'bird', cls: 'bird', leave: 'leave-bird' } },
  { key: 'd', title: 'D · Leaf arrowhead', tag: 'brand',
    note: 'A leaf that points up like an arrowhead, matching the leaves on kordi.ai. Reads as direction, still distinct from planes and plain arrows.',
    mac: { glyph: 'leaf', cls: 'leaf' }, ios: { glyph: 'leaf', cls: 'leaf' } },
  { key: 'e', title: 'E · Ink key', tag: 'variant of B',
    note: 'Option B in the bird ink colour instead of the chat theme accent, so the send button carries the brand mark colour on every chat theme.',
    mac: { glyph: 'arrow', cls: 'key inked' }, ios: { glyph: 'arrow', cls: 'key inked' } },
];

let uid = 0;
function glyph(name) {
  const g = GLYPH[name];
  if (typeof g === 'string') return g;
  return g(`m${++uid}`, '#f7b32b');
}
const sym = (id) => document.getElementById('sym').content.getElementById(id).outerHTML.replace(/ id="[^"]+"/, '');

function sendBtn(spec, platform, ready) {
  const idle = platform === 'ios' && !ready;
  const inner = idle ? sym('s-mic') : glyph(spec.glyph);
  const leave = spec.leave ? ` style="--leave:${spec.leave}"` : '';
  return `<button class="send ${platform} ${spec.cls}${idle ? ' idle' : ''}"${leave}${!ready && platform === 'mac' ? ' disabled' : ''} aria-label="${idle ? 'Switch to voice input' : 'Send message'}"><span class="g">${inner}</span></button>`;
}

function macComposer(spec, ready) {
  return `<div class="m-composer"><span class="m-plus">${sym('s-plus')}</span>
    <span class="m-text${ready ? '' : ' ph'}">${ready ? 'Can you send me the deck before 3?' : 'Message Priya…'}</span>
    <span class="m-voice">${sym('s-voice')}</span>${sendBtn(spec, 'mac', ready)}</div>`;
}
function iosComposer(spec, ready) {
  return `<div class="i-composer"><span class="i-circle">${sym('s-plus')}</span>
    <span class="i-field"><span class="t${ready ? '' : ' ph'}">${ready ? 'On my way' : 'Message'}</span>${sendBtn(spec, 'ios', ready)}</span></div>`;
}

function render() {
  uid = 0;
  document.getElementById('options').innerHTML = OPTIONS.map((o) => `
    <section class="option" id="${o.key}">
      <h2>${o.title}<span class="tag">${o.tag}</span></h2>
      <p>${o.note}</p>
      <div class="row">
        <div><div class="cap">Mac · empty and typed</div><div class="surface mac">${macComposer(o.mac, false)}${macComposer(o.mac, true)}</div></div>
        <div><div class="cap">iPhone · empty (voice) and typed</div><div class="surface ios">${iosComposer(o.ios, false)}${iosComposer(o.ios, true)}</div></div>
        <div><div class="cap">Close up</div><div class="big">${sendBtn(o.mac, 'mac', true).replace('<button', '<button tabindex="-1"')}</div></div>
      </div>
    </section>`).join('');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('.send');
  if (!b || b.disabled || b.classList.contains('idle') || b.classList.contains('go')) return;
  b.classList.add('go');
  setTimeout(() => { b.classList.remove('go'); b.classList.add('back'); setTimeout(() => b.classList.remove('back'), 240); }, 340);
});

const state = new URLSearchParams(location.search);
function apply() {
  const theme = state.get('theme') === 'dark' ? 'dark' : 'light';
  const accent = ACCENTS[state.get('accent')] ? state.get('accent') : 'classic';
  document.documentElement.dataset.theme = theme;
  const [light, dark] = ACCENTS[accent];
  document.documentElement.style.setProperty('--accent', theme === 'dark' ? dark : light);
  document.documentElement.style.setProperty('--accent-on', theme === 'dark' ? '#0b1a2e' : '#ffffff');
  document.querySelectorAll('.seg').forEach((seg) => {
    const v = seg.dataset.param === 'theme' ? theme : accent;
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  });
}
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.set(seg.dataset.param, b.dataset.v);
  history.replaceState(null, '', `?${state}`);
  apply();
}));
render();
apply();
</script>
</body>
</html>
