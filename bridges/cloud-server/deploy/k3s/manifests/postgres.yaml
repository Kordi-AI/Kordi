# Postgres StatefulSet + headless Service for the Kordi cloud server.
#
# Single replica running on the k3s local-path StorageClass — fine for the
# single-node cluster on an operator-provided host; switch to a managed
# Postgres operator (CloudNativePG) when we add HA / replication.
#
# Credentials live in a separate Secret named `postgres-credentials` with
# key `password`. Apply that out of band (see deploy/k3s/README.md). The
# StatefulSet will not start without it.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # Size the buffer cache to the container limit below. The image
          # default (128MB shared_buffers) left most of the memory unused.
          args:
            - "-c"
            - "shared_buffers=1GB"
            - "-c"
            - "effective_cache_size=3GB"
            - "-c"
            - "maintenance_work_mem=128MB"
            # Per-statement counters for performance work. The extension
            # still has to be created once in the database:
            # CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "track_io_timing=on"
            # Log statements slower than 200 ms without their bind
            # parameters, which can contain message text.
            - "-c"
            - "log_min_duration_statement=200ms"
            - "-c"
            - "log_parameter_max_length=0"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: kordi
            - name: POSTGRES_DB
              value: kordi_cloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              # Subdirectory under the mount so the lost+found dir on the
              # filesystem doesn't trip the postgres bootstrap check.
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kordi", "-d", "kordi_cloud"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kordi", "-d", "kordi_cloud"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Parallel queries use POSIX shared memory; the container
            # default /dev/shm is only 64Mi.
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kordi-cloud
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgres
  # Headless service so the StatefulSet pod gets the stable DNS name
  # postgres-0.postgres.kordi-cloud.svc.cluster.local.
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
